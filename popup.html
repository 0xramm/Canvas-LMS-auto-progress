<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Canvas LMS Auto Progress</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f1117;
        --bg2: #1a1b26;
        --bg3: #24253a;
        --border: #2e2f45;
        --text: #e8e9f0;
        --muted: #8b8fa8;
        --accent: #7c6af7;
        --accent2: #5a4fcf;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #f59e0b;
        --radius: 8px;
      }

      body {
        width: 520px;
        min-height: 200px;
        max-height: 600px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── TOP BAR ── */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .topbar h1 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        flex: 1;
      }
      .topbar h1 span {
        color: var(--accent);
      }

      .session-badge {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 99px;
        font-weight: 600;
      }
      .session-badge.ok {
        background: #14532d;
        color: var(--green);
      }
      .session-badge.err {
        background: #450a0a;
        color: var(--red);
      }

      /* ── INPUT ROW ── */
      .input-row {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .input-row input {
        flex: 1;
        padding: 7px 10px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg3);
        color: var(--text);
        font-size: 13px;
      }
      .input-row input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .input-row input::placeholder {
        color: var(--muted);
      }

      .btn {
        padding: 7px 16px;
        border-radius: var(--radius);
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.15s,
          background 0.15s;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        opacity: 0.85;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-success {
        background: var(--green);
        color: #fff;
        font-size: 11px;
        padding: 4px 10px;
      }
      .btn-done {
        background: var(--bg3);
        color: var(--muted);
        font-size: 11px;
        padding: 4px 10px;
        cursor: default;
      }
      .btn-sm {
        font-size: 11px;
        padding: 4px 10px;
      }

      /* ── PROGRESS BAR ── */
      .progress-section {
        padding: 10px 16px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .progress-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .progress-info strong {
        color: var(--text);
      }
      .progress-track {
        height: 6px;
        background: var(--bg3);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--green));
        border-radius: 99px;
        transition: width 0.4s ease;
      }

      /* ── SCROLL BODY ── */
      .scroll-body {
        flex: 1;
        overflow-y: auto;
        padding: 0 0 12px;
      }
      .scroll-body::-webkit-scrollbar {
        width: 5px;
      }
      .scroll-body::-webkit-scrollbar-track {
        background: var(--bg);
      }
      .scroll-body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 99px;
      }

      /* ── MODULE ── */
      .module {
        border-bottom: 1px solid var(--border);
      }
      .module-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px 8px;
        cursor: pointer;
        user-select: none;
      }
      .module-header:hover {
        background: var(--bg2);
      }
      .module-title {
        font-weight: 600;
        font-size: 13px;
        color: var(--text);
        flex: 1;
      }
      .module-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .module-count {
        font-size: 11px;
        color: var(--muted);
      }
      .chevron {
        font-size: 10px;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .module.collapsed .chevron {
        transform: rotate(-90deg);
      }
      .module.collapsed .module-items {
        display: none;
      }

      /* ── ITEMS ── */
      .module-items {
        padding: 0 16px 8px;
      }

      .item-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      .item-row:last-child {
        border-bottom: none;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.done {
        background: var(--green);
      }
      .dot.pending {
        background: var(--red);
      }

      .item-title {
        flex: 1;
        font-size: 12px;
        color: var(--text);
        line-height: 1.4;
      }

      .item-status {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .item-status.done {
        background: #14532d;
        color: var(--green);
      }
      .item-status.pending {
        background: #422006;
        color: var(--yellow);
      }

      /* ── STATES ── */
      #state-loading,
      #state-error,
      #state-empty {
        display: none;
        padding: 32px 16px;
        text-align: center;
        color: var(--muted);
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #state-error {
        color: var(--red);
      }
      #state-error .err-icon {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .mark-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .mark-btn:hover {
        background: var(--accent2);
      }
      .mark-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .mark-btn.done-btn {
        background: var(--bg3);
        color: var(--muted);
        cursor: default;
      }
    </style>
  </head>
  <body>
    <!-- TOP BAR -->
    <div class="topbar">
      <h1>Canvas <span>LMS</span> Auto Progress</h1>
      <div id="session-badge" class="session-badge err">No session</div>
    </div>

    <!-- INPUT ROW -->
    <div class="input-row">
      <input type="text" id="course-id" placeholder="Course ID (e.g. 810)" />
      <button class="btn btn-primary" id="btn-load">Load</button>
    </div>

    <!-- PROGRESS BAR (hidden until loaded) -->
    <div class="progress-section" id="progress-section" style="display: none">
      <div class="progress-info">
        <span>Overall Progress</span>
        <strong id="progress-label">0/0</strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- SCROLL BODY -->
    <div class="scroll-body" id="scroll-body">
      <div id="state-loading">
        <div class="spinner"></div>
        <div id="loading-msg">Loading modules…</div>
      </div>
      <div id="state-error">
        <div class="err-icon">Err</div>
        <div id="error-msg">Something went wrong.</div>
      </div>
      <div id="state-empty" style="display: none">No pages found.</div>
      <div id="modules-container"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
